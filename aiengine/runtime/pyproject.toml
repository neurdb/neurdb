[project]
name = "neurdb-runtime"
version = "0.1.0"
description = "NeurDB AI runtime server"
requires-python = ">=3.9,<3.12"
dependencies = [
    "aiofiles==24.1.0",
    "bidict==0.23.1",
    "blinker==1.8.2",
    "certifi==2024.7.4",
    "charset-normalizer==3.3.2",
    "click==8.1.7",
    "dnspython==2.6.1",
    "einops==0.8.0",
    "eventlet==0.36.1",
    "exceptiongroup==1.2.2",
    "filelock==3.15.4",
    "flask==3.0.3",
    "flask-socketio==5.3.6",
    "fsspec==2024.6.1",
    "greenlet==3.0.3",
    "h11==0.14.0",
    "h2==4.1.0",
    "hpack==4.0.0",
    "hyperframe==6.0.1",
    "idna==3.7",
    "itsdangerous==2.2.0",
    "jinja2==3.1.4",
    "joblib==1.4.2",
    "loguru==0.7.2",
    "markupsafe==2.1.5",
    "mpmath==1.3.0",
    "multipledispatch==1.0.0",
    "networkx==3.1",
    "numpy==1.24.4",
    "orjson==3.9.15",
    "pandas==2.0.3",
    "pydantic>=2.11.10",
    "priority==2.0.0",
    "psycopg2-binary==2.9.9",
    "pygments==2.15.1",
    "python-dateutil==2.9.0.post0",
    "python-engineio==4.9.1",
    "python-socketio==5.11.3",
    "pytz==2024.1",
    "pyyaml==6.0.2",
    "quart==0.19.6",
    "requests==2.32.3",
    "scikit-learn==1.5.2",
    "scipy==1.10.1",
    "simple-websocket==1.0.0",
    "six==1.16.0",
    "structlog==24.4.0",
    "sympy==1.13.0",
    "taskgroup==0.0.0a4",
    "threadpoolctl==3.5.0",
    "tomli==2.0.1",
    "tqdm==4.66.4",
    "transformers==4.36.2",
    "typing-extensions==4.12.2",
    "tzdata==2024.1",
    "urllib3==2.2.2",
    "uvicorn==0.35.0",
    "websocket-client==1.8.0",
    "werkzeug==3.0.6",
    "wsproto==1.2.0",
]

[project.optional-dependencies]
cpu = [
    "torch==1.13.1+cpu",
]
cuda = [
    "nvidia-cublas-cu12==12.1.3.1",
    "nvidia-cuda-cupti-cu12==12.1.105",
    "nvidia-cuda-nvrtc-cu12==12.1.105",
    "nvidia-cuda-runtime-cu12==12.1.105",
    "nvidia-cudnn-cu12==8.9.2.26",
    "nvidia-cufft-cu12==11.0.2.54",
    "nvidia-curand-cu12==10.3.2.106",
    "nvidia-cusolver-cu12==11.4.5.107",
    "nvidia-cusparse-cu12==12.1.0.106",
    "nvidia-nccl-cu12==2.20.5",
    "nvidia-nvjitlink-cu12==12.5.82",
    "nvidia-nvtx-cu12==12.1.105",
    "nvidia-pyindex==1.0.9",
    "torch==1.13.1+cu116",
    "triton==2.3.1",
]

[tool.uv]
package = false
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cuda" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu116", extra = "cuda" },
]

[tool.uv.extra-build-dependencies]
nvidia-pyindex = ["pip"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu116"
url = "https://download.pytorch.org/whl/cu116"
explicit = true
